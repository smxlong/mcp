name: Release mcprolog

# Releases are cut by pushing a tag of the form prolog/vX.Y.Z. The tag prefix
# is the module path, so `go install` and `git describe` agree on the version.
on:
  push:
    tags: ["prolog/v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mcprolog

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: prolog/go.mod
          cache-dependency-path: prolog/go.sum

      - name: Build
        working-directory: prolog
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#prolog/}"
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${platform%/*}"; arch="${platform#*/}"; ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            name="mcprolog_${version}_${os}_${arch}"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${version}" \
              -o "dist/$name/mcprolog${ext}" ./cmd/mcprolog
            cp ../LICENSE README.md "dist/$name/"
            tar -czf "dist/${name}.tar.gz" -C dist "$name"
            rm -rf "dist/$name"
          done
          ( cd dist && sha256sum ./*.tar.gz > checksums.txt )

      - uses: softprops/action-gh-release@v2
        with:
          files: prolog/dist/*
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        run: echo "version=${GITHUB_REF_NAME#prolog/}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: prolog
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
